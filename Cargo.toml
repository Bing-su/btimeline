[package]
name = "btimeline"
version = "0.1.0"
edition = "2024"
license = "BlueOak-1.0.0"

[dependencies]
anyhow = "1"
base64 = "0.23"
camino = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
ureq = { version = "3", features = ["json"] }
usage = { package = "usage-rs", version = "6", features = ["completions"] }

[lints.clippy]
unwrap_used = "deny"

[profile.release]
strip = true
lto = true
